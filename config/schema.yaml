ingestion:

  foreign_key: "TransactionID"

  target_column: "isFraud"

  required_columns:
    - TransactionID
    - isFraud
    - TransactionDT
    - TransactionAmt
    - ProductCD

  numerical_columns:
    - TransactionDT
    - TransactionAmt
    - dist1
    - dist2

  categorical_columns:
    - ProductCD
    - card4
    - card6
    - P_emaildomain
    - R_emaildomain
    - DeviceType
    - DeviceInfo

  binary_columns:
    - M1
    - M2
    - M3
    - M4
    - M5
    - M6
    - M7
    - M8
    - M9

  id_columns:
    - id_01
    - id_02
    - id_03

  v_columns_prefix: "V"

  expected_dtypes:

    TransactionID: int64
    isFraud: int8
    TransactionDT: int64
    TransactionAmt: float32

  allowed_values:

    ProductCD:
      - W
      - C
      - H
      - R
      - S

    card4:
      - visa
      - mastercard
      - american express
      - discover

    card6:
      - debit
      - credit

  null_thresholds:

    TransactionAmt: 0.05
    ProductCD: 0.02
    DeviceType: 0.80

  range_checks:

    TransactionAmt:
      min: 0
      max: 100000

    TransactionDT:
      min: 0

  uniqueness_constraints:
    - TransactionID

  merge_validation:

    expected_join_type: "one_to_one"

    allow_missing_identity_rows: true

  file_validation:

    allowed_extensions:
      - ".csv"
      - ".parquet"

    minimum_rows: 1000

  drift_monitoring:

    monitor_columns:
      - TransactionAmt
      - ProductCD
      - card4
      - DeviceType