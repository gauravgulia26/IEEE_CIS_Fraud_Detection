[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "This project builds a production-grade machine learning system to detect fraudulent financial transactions using the IEEE-CIS dataset. The solution is designed as a fully automated, scalable pipeline that handles the complete lifecycle of machine learning from data ingestion to real-time prediction. The system uses DVC for data and model versioning, Airflow to orchestrate end-to-end workflows, and MLflow to track experiments and manage model versions. A trained model is deployed as a Dockerized FastAPI service to provide real-time fraud predictions through API endpoints."
authors = [
  { name = "Gourav Gulia" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["src"]
force_sort_within_sections = true


